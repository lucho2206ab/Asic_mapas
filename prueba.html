<!DOCTYPE html>
<html lang="es">
<head>
  <title>Mapa de Usuarios y Red de Riego</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    #map { height: 600px; width: 100%; }
  </style>
</head>
<body>
  <h2>Usuarios y Red de Riego</h2>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // Inicializar mapa en Mendoza
    const map = L.map('map').setView([-32.889, -68.845], 13);

    // Capa base
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Definir control de capas (vacío al inicio)
    const baseMaps = { "OpenStreetMap": osm };
    const overlayMaps = {};
    const controlCapas = L.control.layers(baseMaps, overlayMaps).addTo(map);
    // ===============================================
    // 1. DECLARACIÓN DE VARIABLES PARA CARGA CONDICIONAL
    // ===============================================
    let capaParcelario;

    // ============================
    // CAPA 1: Red de Riego (desde archivo GeoJSON)
    // ============================
    fetch("data/RedRiegoPrimeraZona_wgs84.geojson")
      .then(res => res.json())
      .then(data => {
        const capaRiego = L.geoJSON(data, {
          style: { color: "blue", weight: 2 },
          onEachFeature: (feature, layer) => {
            if (feature.properties) {
              layer.bindPopup(
                Object.keys(feature.properties)
                  .map(k => `<b>${k}</b>: ${feature.properties[k]}`)
                  .join("<br>")
              );
            }
          }
        }).addTo(map);

        controlCapas.addOverlay(capaRiego, "Red de Riego");
      });

    // ============================
    // CAPA 2: Parcelario (carga condicional)
    // ============================
    fetch("data/ParcelarioRioMendoza-DerechoSuperior_wgs84.geojson")
      .then(res => res.json())
      .then(data => {
        const capaParcelario = L.geoJSON(data, {
          style: { color: "orange", weight: 1, fillColor: "orange", fillOpacity: 0.1 },
          onEachFeature: (feature, layer) => {
            if (feature.properties) {
              layer.bindPopup(
                Object.keys(feature.properties)
                  .map(k => `<b>${k}</b>: ${feature.properties[k]}`)
                  .join("<br>")
              );
            }
          }
        });

        controlCapas.addOverlay(capaParcelario, "Parcelario");
      });

    // ============================
    // CAPA 3: Asociaciones (desde archivo JSON)
    // ============================
    fetch("data/asociaciones.json")
      .then(res => res.json())
      .then(data => {
        const capaAsociaciones = L.geoJSON(data, {
          style: { color: "purple", weight: 2, fillColor: "purple", fillOpacity: 0.5 },
          onEachFeature: (feature, layer) => {
            if (feature.properties) {
              layer.bindPopup(
                Object.keys(feature.properties)
                  .map(k => `<b>${k}</b>: ${feature.properties[k]}`)
                  .join("<br>")
              );
            }
          }
        });

        controlCapas.addOverlay(capaAsociaciones, "Asociaciones");
      });

    // ============================
    // CAPA 4: Cuencas (desde archivo JSON)
    // ============================
    fetch("data/cuencas.json")
      .then(res => res.json())
      .then(data => {
        const capaCuencas = L.geoJSON(data, {
          style: { color: "brown", weight: 2, fillColor: "brown", fillOpacity: 0.3 },
          onEachFeature: (feature, layer) => {
            if (feature.properties) {
              layer.bindPopup(
                Object.keys(feature.properties)
                  .map(k => `<b>${k}</b>: ${feature.properties[k]}`)
                  .join("<br>")
              );
            }
          }
        });

        controlCapas.addOverlay(capaCuencas, "Cuencas");
      });

    // ============================
    // CAPA 5: Red Primaria (desde archivo JSON)
    // ============================
    fetch("data/red-primaria.json")
      .then(res => res.json())
      .then(data => {
        const capaRedPrimaria = L.geoJSON(data, {
          style: { color: "red", weight: 3 },
          onEachFeature: (feature, layer) => {
            if (feature.properties) {
              layer.bindPopup(
                Object.keys(feature.properties)
                  .map(k => `<b>${k}</b>: ${feature.properties[k]}`)
                  .join("<br>")
              );
            }
          }
        });

        controlCapas.addOverlay(capaRedPrimaria, "Red Primaria");
      });
    // ============================
    // CAPA 6: Derechos superficiales RM (con etiquetas ccpp1)
    // ============================
    fetch("data/DerechosSuperficialesRioMendoza.geojson")
      .then(res => res.json())
      .then(data => {
        const capaDerechosSuperficialesRM = L.geoJSON(data, {
          style: { color: "orange", weight: 1, opacity: 0.5, fillColor: "orange", fillOpacity: 0.2 },
          onEachFeature: (feature, layer) => {
            if (feature.properties) {
              // 1. Vincular el popup como ya lo tienes
              layer.bindPopup(
                Object.keys(feature.properties)
                  .map(k => `<b>${k}</b>: ${feature.properties[k]}`)
                  .join("<br>")
              );

              // 2. Agregar la etiqueta permanente (Tooltip)
              if (feature.properties.ccpp1) {
                // El 'permanent: true' hace que la etiqueta se muestre siempre
                // El 'direction: center' intenta ubicarla en el medio del elemento
                layer.bindTooltip(feature.properties.ccpp1, {
                  permanent: false,
                  direction: "center",
                  className: "etiqueta-ccpp1" // Usaremos esta clase para estilizar
                });
              }
            }
          }
        });

        controlCapas.addOverlay(capaDerechosSuperficialesRM, "Derechos Superficiales RM");
      });
      // ============================
    // CAPA 7: Parcelario 1104 1106 1010 1016
    // ============================
    fetch("data/Parcelario_1104_1106_1010_1016.geojson")
      .then(res => res.json())
      .then(data => {
        const capaParcelario1104_1106_1010_1016 = L.geoJSON(data, {
          style: { color: "purple", weight: 3 },
          onEachFeature: (feature, layer) => {
            if (feature.properties) {
              layer.bindPopup(
                Object.keys(feature.properties)
                  .map(k => `<b>${k}</b>: ${feature.properties[k]}`)
                  .join("<br>")
              );
            }
          }
        });

        controlCapas.addOverlay(capaParcelario1104_1106_1010_1016, "Parcelario 1104-1106-1010-1016");
      });
      // ===============================================
    // 8. MANEJO DE EVENTO DE ZOOM (Va al final de todos los fetch)
    // ===============================================
    map.on('zoomend', () => {
        const currentZoom = map.getZoom();
        const zoomThreshold = 14; // Nivel de zoom donde quieres que se active la capa

        // Lógica para la capa de Parcelario
        if (capaParcelario) { // Verifica que la capa ya se haya cargado (fetch completado)
            if (currentZoom >= zoomThreshold) {
                // Si el zoom es suficiente Y la capa aún NO está en el mapa, la añadimos.
                if (!map.hasLayer(capaParcelario)) {
                    capaParcelario.addTo(map);
                    console.log('Parcelario añadido al mapa.');
                }
            } else {
                // Si el zoom es muy bajo Y la capa SÍ está en el mapa, la removemos.
                if (map.hasLayer(capaParcelario)) {
                    map.removeLayer(capaParcelario);
                    console.log('Parcelario removido del mapa (Zoom bajo).');
                }
            }
        }
    });
  </script>
</body>
</html>
